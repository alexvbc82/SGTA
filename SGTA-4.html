<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SGTA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2B3A4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGTA">
<style>
:root{
  --accent:#6B93B0;
  --accent-light:#B0C9CC;
  --accent-mid: color-mix(in srgb, #6B93B0 50%, #B0C9CC 50%);
  --accent-dark: color-mix(in srgb, #6B93B0 75%, black 25%);
  --accent-soft:#B0C9CC55;
  --bg: color-mix(in srgb, #B0C9CC 55%, white 45%);
  --card:#FFFFFF;
  --ink:#22282C;
  --ink-soft:#6B7580;
  --line:#E7EAEC;
  --green:#4C9A72;
  --orange:#E19A4E;
  --red:#C96060;
  --gray:#5B6066;
  --black:#1B1E20;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 14px rgba(30,40,50,0.10);
}
[data-theme="warm"]{
  --accent:#C48F94;
  --accent-light:#EDCCC0;
  --accent-mid: color-mix(in srgb, #C48F94 50%, #EDCCC0 50%);
  --accent-dark: color-mix(in srgb, #C48F94 75%, black 25%);
  --accent-soft:#EDCCC066;
  --bg: color-mix(in srgb, #EDCCC0 55%, white 45%);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);position:relative;}
header.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px 18px;
  background:var(--bg);
  position:sticky;top:0;z-index:5;
}
header.topbar .titlewrap{display:flex;align-items:center;gap:10px;}
header.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
header.topbar .brand-kicker{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--accent-dark);margin-bottom:1px;}
header.topbar .backbtn{
  border:none;background:none;font-size:22px;color:var(--accent);padding:2px 4px 2px 0;cursor:pointer;
}
header.topbar .gear{
  border:none;background:var(--card);width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;font-size:18px;
}
main{flex:1;overflow-y:auto;padding:0 16px 90px 16px;-webkit-overflow-scrolling:touch;}
nav.bottom-nav{
  position:sticky;bottom:0;left:0;right:0;
  background:var(--card);
  border-top:1.5px solid var(--accent-mid);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom)) 4px;
  z-index:10;
}
nav.bottom-nav button{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-soft);font-size:10.5px;font-weight:600;padding:4px 6px;cursor:pointer;flex:1;
}
nav.bottom-nav button .ic{font-size:19px;}
nav.bottom-nav button.active{color:var(--accent);}

.card{
  background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow);
}
.card.tap{cursor:pointer;}
.section-title{font-size:13px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px 2px;}
.section-title:first-child{margin-top:4px;}

.turma-card{display:flex;justify-content:space-between;align-items:center;}
.turma-card .name{font-weight:700;font-size:16px;}
.turma-card .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.turma-card .count{font-size:12px;color:var(--accent);font-weight:700;background:var(--accent-soft);padding:4px 10px;border-radius:20px;}

.btn{
  background:var(--accent);color:var(--black);border:none;border-radius:12px;padding:13px 18px;
  font-size:15px;font-weight:700;cursor:pointer;width:100%;text-align:center;
}
.btn.secondary{background:var(--accent);color:var(--black);border:none;}
.btn.ghost{background:none;color:var(--ink-soft);font-weight:600;}
.btn.danger{background:var(--red);color:#fff;}
.btn.small{padding:9px 14px;font-size:13.5px;width:auto;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-row .btn{flex:1;}

.student-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;
}
.student-row:last-child{border-bottom:none;}
.student-row .left{display:flex;align-items:baseline;gap:8px;min-width:0;}
.student-row .num{color:var(--ink-soft);font-size:12.5px;font-weight:700;min-width:16px;}
.student-row .info{min-width:0;}
.student-row .sname{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.student-row .sbook{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.dot{width:19px;height:19px;border-radius:50%;flex-shrink:0;margin-left:8px;}
.dot.green{background:var(--green);}
.dot.orange{background:var(--orange);}
.dot.red{background:var(--red);}
.dot.gray{background:var(--gray);}
.dot.black{background:var(--black);}
.dot.white{background:#fff;border:2px solid var(--black);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;
  background:#fff;color:var(--ink);font-family:inherit;
}
.field textarea{resize:vertical;min-height:60px;}
.datefield{display:flex;align-items:center;gap:8px;}
.datefield input[type=date]{flex:1;}
.datefield button{
  border:1.5px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:16px;color:var(--accent);cursor:pointer;
}
.dropbox{position:relative;}
.dropbox select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%236B7580' d='M5 7l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;}

.pillrow{display:flex;gap:8px;flex-wrap:wrap;}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--black);}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,25,30,0.42);display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
}
.modal-overlay.center{align-items:center;padding:20px;}
.modal{
  background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom)) 18px;max-height:88vh;overflow-y:auto;
}
.modal-overlay.center .modal{border-radius:18px;max-width:400px;}
.modal h2{margin:0 0 16px 0;font-size:18px;}
.modal p.sub{color:var(--ink-soft);font-size:13.5px;margin:-10px 0 16px 0;}

.confirm-icon{font-size:34px;text-align:center;margin-bottom:6px;}
.confirm-text{text-align:center;font-size:15.5px;font-weight:600;margin-bottom:4px;}
.confirm-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:18px;}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty .ic{font-size:36px;margin-bottom:10px;}

.badge-ref{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin-bottom:14px;display:flex;justify-content:space-between;}
.badge-ref b{color:var(--accent);}

.autocomplete-list{border:1.5px solid var(--line);border-top:none;border-radius:0 0 10px 10px;background:#fff;max-height:160px;overflow-y:auto;margin-top:-14px;margin-bottom:14px;}
.autocomplete-list div{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line);}
.autocomplete-list div:last-child{border-bottom:none;}

.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.month-nav .mtitle{font-size:17px;font-weight:700;text-transform:capitalize;}
.month-nav button{background:var(--card);border:none;width:36px;height:36px;border-radius:50%;box-shadow:var(--shadow);font-size:16px;color:var(--accent);}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.calendar-grid .wd{font-size:11px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
.calendar-grid .day{
  position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:13.5px;border-radius:10px;color:var(--ink);
}
.calendar-grid .day.empty2{visibility:hidden;}
.calendar-grid .day.bday{background:#F3B4C7;color:#5b1f34;font-weight:700;}
.calendar-grid .day.activity{background:#F3E08A;color:#5b4f16;font-weight:700;}
.calendar-grid .day.both{background:linear-gradient(180deg,#F3B4C7 50%,#F3E08A 50%);color:#3a3a3a;font-weight:700;}
.list-item{padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px;}
.list-item:last-child{border-bottom:none;}
.list-item .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap;height:fit-content;}

.abs-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);}
.abs-row .cnt{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px;}

.settheme-opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;}
.settheme-opt.sel{border-color:var(--accent);}
.swatches{display:flex;}
.swatches span{width:26px;height:26px;border-radius:50%;margin-left:-8px;border:2px solid #fff;}
.swatches span:first-child{margin-left:0;}

.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:30px;font-size:13.5px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,0.2);
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1;}

.tut-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(12,16,20,0.68);z-index:200;pointer-events:none;transition:all .25s;}
.tut-dim{position:fixed;inset:0;background:rgba(12,16,20,0.68);z-index:200;}
.tut-tip{
  position:fixed;left:16px;right:16px;z-index:201;background:var(--card);border-radius:16px;
  padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.3);max-width:520px;margin:0 auto;
  max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;
}
.tut-tip-scroll{overflow-y:auto;flex:1 1 auto;min-height:0;}
.tut-tip h4{margin:0 0 6px 0;font-size:16px;}
.tut-tip p{margin:0 0 14px 0;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
.tut-tip .tut-row{display:flex;justify-content:space-between;align-items:center;}
.tut-tip .tut-skip{background:none;border:none;color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;padding:8px 4px;}
.tut-tip .tut-next{background:var(--accent);color:var(--black);border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;}
.tut-tip .tut-dots{display:flex;gap:5px;justify-content:center;margin-bottom:10px;}
.tut-tip .tut-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}
.tut-tip .tut-dots span.on{background:var(--accent);}
.instr-block{margin-bottom:22px;}
.instr-block p{margin:0 0 8px 0 !important;}
.instr-block p:last-child{margin-bottom:0 !important;}
.instr-block h4{margin:0 0 4px 0;font-size:14px;color:var(--accent-dark);}
.instr-block p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
.breadcrumb{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:6px;cursor:pointer;}
h3.sub-title{font-size:15px;margin:0 0 10px 2px;}

.birth-row{display:flex;gap:8px;}
.birth-row select{
  flex:1;padding:11px 8px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;
  background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none;text-align:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%236B7580' d='M5 7l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 6px center;padding-right:22px;
}
.birth-hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}

.dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.dp-header button{background:var(--card);border:1.5px solid var(--line);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;}
.dp-header button.ok{background:var(--accent);color:var(--black);border:none;}
.dp-header .dp-title{font-weight:700;font-size:16px;}
.dp-list{max-height:52vh;overflow-y:auto;border-radius:12px;}
.dp-row{
  display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;font-size:15px;
}
.dp-row:last-child{border-bottom:none;}
.dp-row.today{background:var(--accent-soft);font-weight:700;border-radius:10px;}
.dp-row.selected{background:var(--accent);color:var(--black);border-radius:10px;font-weight:700;}
.dp-row .wd{color:var(--ink-soft);font-size:12.5px;}
.dp-row.selected .wd{color:#00000099;}
.dp-jump{text-align:center;margin-top:12px;}
.dp-jump a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;}
</style>
<!-- particular icon stored below in JS as base64 -->
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
  <nav class="bottom-nav" id="bottomnav">
    <button data-tab="turmas"><span class="ic">📚</span>Turmas</button>
    <button data-tab="particulares"><span class="ic" id="navParticularIcon"></span>Particulares</button>
    <button data-tab="calendario"><span class="ic">📅</span>Calendário</button>
    <button data-tab="absence"><span class="ic">📋</span>Absence</button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="tutorial-root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SGTA - Sistema de Gerenciamento da Teacher Alex
   App único offline, dados salvos em localStorage
   ========================================================= */


const STORAGE_KEY = 'sgta_data_v1';
const PARTICULAR_ORANGE = '#E3A876';
function personIconSVG(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${PARTICULAR_ORANGE}" style="vertical-align:middle"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
}
const DIAS_SEMANA = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);

/* ---------- GUIDED TUTORIAL ---------- */
function dotLegendRows(){
  return [
    ['green','Em dia'],
    ['orange','1ª prova atrasada'],
    ['red','Prova final atrasada'],
    ['white','Sem datas ainda'],
    ['gray','Nova data futura marcada'],
    ['black','Nova data já passou']
  ].map(([c,label])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="dot ${c}" style="margin-left:0;flex-shrink:0"></span><span>${label}</span></div>`).join('');
}
const DOT_LEGEND_HTML = `<div style="text-align:left">${dotLegendRows()}</div>`;
const DAY_COLORS = { b:'#F3B4C7', a:'#F3E08A', e1:'#CBE3F7', e2:'#7FA6CC' };
function calendarLegendRows(){
  return [
    [DAY_COLORS.b,'Aniversário de aluno'],
    [DAY_COLORS.a,'Atividade cadastrada'],
    [DAY_COLORS.e1,'1ª prova'],
    [DAY_COLORS.e2,'Prova final / nova prova final']
  ].map(([color,label])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:14px;height:14px;background:${color};border-radius:4px;flex-shrink:0"></span><span>${label}</span></div>`).join('');
}
const CAL_LEGEND_HTML = `<div style="text-align:left">${calendarLegendRows()}</div>`;
const TUTORIAL_STEPS = [
  {type:'center', title:'Bem-vinda ao SGTA 👋', text:'Vamos fazer um tour rápido pelas telas principais e mostrar como começar. Você pode pular a qualquer momento.'},
  {type:'spot', target:'[data-tab="turmas"]', title:'Turmas', text:'Suas turmas ficam aqui.<br><br>No topo, o campo de busca acha qualquer aluno pelo nome — inclusive os já encerrados no histórico.<br><br>Toque numa turma para ver os alunos (ordem alfabética). Toque em "+ Inserir novo aluno" para cadastrar.<br><br>Toque no nome do aluno para editar dados, provas e "Atividades" (tarefas com prazo, ficam laranja se atrasarem).'},
  {type:'spot', target:'[data-tab="particulares"]', title:'Particulares', text:'Alunos de aula particular ficam aqui, com dados de pagamento.<br><br>Não entram na lista de chamada das turmas.<br><br>Toque em "+ Inserir aluno particular" para cadastrar o primeiro.<br><br>Você escolhe a ordem da lista: alfabética ou manual.'},
  {type:'spot', target:'[data-tab="calendario"]', topPos:55, title:'Calendário', text:`Cada dia colorido indica algo especial:<br>${CAL_LEGEND_HTML}Mais de um evento no mesmo dia? A cor aparece dividida.<br><br>Arraste o dedo (ou use as setinhas) para trocar de mês. Abaixo, as listas do mês: provas, aniversariantes e atividades.`},
  {type:'spot', target:'[data-tab="absence"]', title:'Absence Control', text:'Registre as faltas dos alunos com data e motivo. Ao digitar o nome, o app sugere os alunos já cadastrados. Dá pra consultar e limpar por aluno quando terminar o livro.'},
  {type:'spot', target:'.gear', title:'Ajustes', text:'Aqui você troca o tema de cores, faz backup dos dados e revê estas instruções sempre que precisar.'},
  {type:'center', title:'Cores de referência', text: DOT_LEGEND_HTML},
  {type:'center', title:'Pronto! 🎉', text:'Você pode rever este tutorial quando quiser em Ajustes → Ver tutorial.', final:true}
];
function startTutorial(){
  window._tutStep = 0;
  renderTutorialStep();
}
function skipTutorial(){ endTutorial(); }
function nextTutorialStep(){
  window._tutStep++;
  if(window._tutStep>=TUTORIAL_STEPS.length){ endTutorial(); return; }
  renderTutorialStep();
}
function endTutorial(){
  document.getElementById('tutorial-root').innerHTML='';
  DATA.settings.tutorialSeen = true;
  save();
}
function renderTutorialStep(){
  const step = TUTORIAL_STEPS[window._tutStep];
  const root = document.getElementById('tutorial-root');
  const isLast = window._tutStep===TUTORIAL_STEPS.length-1;
  const dots = TUTORIAL_STEPS.map((s,i)=>`<span class="${i===window._tutStep?'on':''}"></span>`).join('');
  const tipBody = `
    <div class="tut-tip-scroll">
      <div class="tut-dots">${dots}</div>
      <h4>${step.title}</h4>
      <div style="margin:0 0 14px 0;font-size:13.5px;color:var(--ink-soft);line-height:1.5;">${step.text}</div>
    </div>
    <div class="tut-row" style="flex-shrink:0;padding-top:10px;">
      ${isLast?'<span></span>':`<button class="tut-skip" onclick="skipTutorial()">Pular</button>`}
      <button class="tut-next" onclick="nextTutorialStep()">${isLast?'Concluir':'Próximo'}</button>
    </div>
  `;
  if(step.type==='center'){
    root.innerHTML = `
      <div class="tut-dim"></div>
      <div class="tut-tip" style="top:50%;transform:translateY(-50%)">${tipBody}</div>
    `;
    return;
  }
  const el = document.querySelector(step.target);
  if(!el){ nextTutorialStep(); return; }
  const r = el.getBoundingClientRect();
  const pad = 8;
  const spotTop = r.top-pad, spotLeft = r.left-pad, spotW = r.width+pad*2, spotH = r.height+pad*2;
  const spaceBelow = window.innerHeight - (spotTop+spotH);
  // Coloca a caixinha bem mais acima na tela, longe da área do botão em destaque
  const tipStyle = `top:${step.topPos||110}px`;
  root.innerHTML = `
    <div class="tut-spot" style="top:${spotTop}px;left:${spotLeft}px;width:${spotW}px;height:${spotH}px;"></div>

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtDateTime(isoStamp){
  if(!isoStamp) return '—';
  const d = new Date(isoStamp);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} às ${hh}:${mi}`;
}
function fmtBirth(iso){
  if(!iso || iso==='0000-00-00') return '—';
  const [y,m,d] = iso.split('-');
  let out=[];
  if(d && d!=='00') out.push(d);
  if(m && m!=='00') out.push(m);
  if(y && y!=='0000') out.push(y);
  return out.length ? out.join('/') : '—';
}

/* ---------- DOT STATUS LOGIC ---------- */
function calcAge(iso){
  if(!iso || iso==='0000-00-00') return null;
  const [y,m,d] = iso.split('-');
  if(!y || y==='0000' || !m || m==='00' || !d || d==='00') return null;
  const birth = new Date(Number(y), Number(m)-1, Number(d));
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const mDiff = today.getMonth() - birth.getMonth();
  if(mDiff < 0 || (mDiff===0 && today.getDate() < birth.getDate())) age--;
  return age;
}
function ageTag(dates){
  const age = (dates && dates.birth) ? calcAge(dates.birth) : null;
  return (age!=null && age>=0) ? ` <span style="font-size:12px;color:var(--ink-soft);font-weight:400">(${age} anos)</span>` : '';
}
function dotStatus(dates){
  const {firstExam, finalExam, newFinalExam} = dates;
  const today = todayISO();
  if(!firstExam && !finalExam && !newFinalExam) return 'white';
  if(newFinalExam){
    return (newFinalExam >= today) ? 'gray' : 'black';
  }
  if(finalExam){
    return (today > finalExam) ? 'red' : 'green';
  }
  if(firstExam){
    return (today > firstExam) ? 'orange' : 'green';
  }
  return 'white';
}

/* ---------- BIRTH DATE FIELD (dia/mês/ano dropbox, ano opcional) ---------- */
window._birthHandlers = {};
function birthField(prefix, label, value, onSaveCb){
  window._birthHandlers[prefix] = onSaveCb;
  let y='0000', m='00', d='00';
  if(value && value!=='0000-00-00'){ [y,m,d] = value.split('-'); }
  const days = Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0'));
  const years = []; const curY = new Date().getFullYear();
  for(let yy=curY; yy>=curY-90; yy--) years.push(yy);
  return `
    <div class="field">
      <label>${label}</label>
      <div class="birth-row">
        <select id="${prefix}_d" onchange="handleBirthChange('${prefix}')">
          <option value="00">Dia</option>
          ${days.map(dd=>`<option value="${dd}" ${dd===d?'selected':''}>${dd}</option>`).join('')}
        </select>
        <select id="${prefix}_m" onchange="handleBirthChange('${prefix}')">
          <option value="00">Mês</option>
          ${MESES.map((nm,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===m?'selected':''}>${MESES_ABR[i]}</option>`).join('')}
        </select>
        <select id="${prefix}_y" onchange="handleBirthChange('${prefix}')">
          <option value="0000">Ano</option>
          ${years.map(yy=>`<option value="${yy}" ${String(yy)===y?'selected':''}>${yy}</option>`).join('')}
        </select>
      </div>
      <div class="birth-hint">Ano opcional</div>
    </div>
  `;
}
function handleBirthChange(prefix){
  const d = document.getElementById(prefix+'_d').value;
  const m = document.getElementById(prefix+'_m').value;
  const y = document.getElementById(prefix+'_y').value;
  const composed = `${y}-${m}-${d}`;
  if(window._birthHandlers[prefix]) window._birthHandlers[prefix](composed);
}

/* ---------- AMPULHETA-STYLE DATE PICKER (sem hora) ---------- */
function openDatePicker(currentVal, onPick){
  const base = currentVal ? new Date(currentVal+'T00:00:00') : new Date();
  openDatePickerRange(base, onPick);
}
function openDatePickerRange(centerDate, onPick){
  const days = [];
  for(let i=-4;i<=15;i++){
    const d = new Date(centerDate);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  const todayS = todayISO();
  const rows = days.map(d=>{
    const iso = d.toISOString().slice(0,10);
    const isToday = iso===todayS;
    const label = iso===todayS ? 'Hoje' : `${WD_ABR[d.getDay()]}, ${d.getDate()} de ${MESES_ABR[d.getMonth()].toLowerCase()}`;
    return `<div class="dp-row ${isToday?'today':''}" onclick="pickDate('${iso}')">
      <span>${label}</span><span class="wd">${d.getFullYear()}</span>
    </div>`;
  }).join('');

  openModal(`
    <div class="dp-header">
      <button onclick="shiftDatePicker(-14)">‹</button>
      <div class="dp-title">Selecionar data</div>
      <button onclick="shiftDatePicker(14)">›</button>
    </div>
    <div class="dp-list">${rows}</div>
    <div class="dp-jump"><a onclick="switchToNativeDate()">Digitar uma data específica</a></div>
  `);
  window._dpCenter = centerDate;
  window._dpCallback = onPick;
}
function shiftDatePicker(days){
  const d = new Date(window._dpCenter);
  d.setDate(d.getDate()+days);
  openDatePickerRange(d, window._dpCallback);
}
function pickDate(iso){
  const cb = window._dpCallback;
  closeModal();
  if(cb) cb(iso);
}
function switchToNativeDate(){
  const cb = window._dpCallback;
  openModal(`
    <h2>Digitar data</h2>
    <div class="field"><input type="date" id="dpNativeInput" value="${todayISO()}"></div>
    <div class="btn-row">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="confirmNativeDate()">OK</button>
    </div>
  `);
  window._dpCallback = cb;
}
function confirmNativeDate(){
  const val = document.getElementById('dpNativeInput').value;
  const cb = window._dpCallback;
  closeModal();
  if(val && cb) cb(val);
}

function exportarListaChamada(tid){
  const t = DATA.turmas.find(x=>x.id===tid);
  const ativos = sortByName(t.students.filter(s=>s.status==='ativo'));
  const isRegular = t.type==='regular';
  let txt = `${t.name} — ${t.day} ${t.time}\n`;
  if(isRegular && t.currentBook) txt += `Livro: ${t.currentBook}\n`;
  txt += `\n`;
  ativos.forEach((s,i)=>{
    txt += `${i+1}. ${s.name}`;
    if(!isRegular && s.book) txt += ` — ${s.book}`;
    txt += `\n`;
  });
  txt = txt.replace(/\n+$/, '');
  openModal(`
    <h2>Lista de chamada</h2>
    <textarea id="exportListaText" readonly style="width:100%;min-height:220px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;">${txt}</textarea>
    <div class="btn-row">
      <button class="btn secondary" onclick="closeModal()">Fechar</button>
      <button class="btn" onclick="copiarListaChamada()">Copiar texto</button>
    </div>
  `);
}
function copiarListaChamada(){
  const el = document.getElementById('exportListaText');
  const text = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      toast('Lista copiada! Cole onde quiser.');
    }).catch(()=>{
      fallbackCopy(el, text);
    });
  } else {
    fallbackCopy(el, text);
  }
}
function fallbackCopy(el, text){
  el.select();
  el.setSelectionRange(0, text.length);
  try{
    const ok = document.execCommand('copy');
    toast(ok ? 'Lista copiada! Cole onde quiser.' : 'Não consegui copiar — selecione e copie manualmente.');
  }catch(e){
    toast('Não consegui copiar — selecione e copie manualmente.');
  }
}

function durationLabel(startISO, endISO){
  if(!startISO) return '';
  const start = new Date(startISO+'T00:00:00');
  const end = endISO ? new Date(endISO+'T00:00:00') : new Date();
  let months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth());
  if(end.getDate() < start.getDate()) months--;
  if(months<0) months=0;
  const years = Math.floor(months/12);
  const remMonths = months%12;
  const parts = [];
  if(years>0) parts.push(`${years} ano${years===1?'':'s'}`);
  if(remMonths>0 || years===0) parts.push(`${remMonths} ${remMonths===1?'mês':'meses'}`);
  return parts.join(' e ');
}

/* =========================================================
   CALENDÁRIO
   ========================================================= */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WD = ['D','S','T','Q','Q','S','S'];

function allStudentsFlat(){
  const arr = [];
  DATA.turmas.forEach(t=>{
    t.students.forEach(s=> arr.push({...s, turma:t.name, turmaType:t.type, turmaId:t.id}));
  });
  DATA.particulares.forEach(p=> arr.push({...p, turma:'Particular', turmaType:'particular'}));
  return arr;
}

function renderCalendarioScreen(){
  const y = nav.calYear, m = nav.calMonth;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();

  const students = allStudentsFlat();
  const bdaysByDay = {};
  students.forEach(s=>{
    if(s.dates && s.dates.birth){
      const [by,bm,bd] = s.dates.birth.split('-').map(Number);
      if(bm-1===m){ bdaysByDay[bd] = bdaysByDay[bd]||[]; bdaysByDay[bd].push(s); }
    }
  });
  const actsByDay = {};
  DATA.activities.forEach(a=>{
    const [ay,am,ad] = a.date.split('-').map(Number);
    if(am-1===m && ay===y){ actsByDay[ad] = actsByDay[ad]||[]; actsByDay[ad].push(a); }
  });
  // per-student activities (turmas personalizadas/regulares e particulares) also count as "atividade" (amarelo)
  DATA.turmas.forEach(t=>{
    t.students.forEach(s=>{
      (s.activities||[]).forEach(a=>{
        const [ay,am,ad] = a.date.split('-').map(Number);
        if(am-1===m && ay===y){
          actsByDay[ad] = actsByDay[ad]||[];
          actsByDay[ad].push({...a, studentName:s.name, turma:t.name, ownerKind:'turmaStudent', id1:t.id, id2:s.id});
        }
      });
    });
  });
  DATA.particulares.forEach(p=>{
    (p.activities||[]).forEach(a=>{
      const [ay,am,ad] = a.date.split('-').map(Number);
      if(am-1===m && ay===y){
        actsByDay[ad] = actsByDay[ad]||[];
        actsByDay[ad].push({...a, studentName:p.name, turma:'Particular', ownerKind:'particular', id1:p.id, id2:''});
      }
    });
  });

  // exams this month (computed before building cells so the calendar can show them too)
  const examFirstList = [];
  const examFinalList = [];
  const examsByDay = {}; // day -> 'e1' | 'e2' (e2 wins if both present)
  students.forEach(s=>{
    if(!s.dates) return;
    ['firstExam','finalExam','newFinalExam'].forEach(key=>{
      const val = s.dates[key];
      if(val){
        const [ey,em,ed] = val.split('-').map(Number);
        if(em-1===m && ey===y){
          const isFirst = key==='firstExam';
          const item = {date:val, name:s.name, turma:s.turma, status:dotStatus(s.dates), tipo: isFirst?'1ª prova':(key==='newFinalExam'?'Nova prova final':'Prova final')};
          (isFirst ? examFirstList : examFinalList).push(item);
          examsByDay[ed] = (examsByDay[ed]==='e2') ? 'e2' : (isFirst ? 'e1' : 'e2');
        }
      }
    });
  });
  examFirstList.sort((a,b)=>a.date.localeCompare(b.date));
  examFinalList.sort((a,b)=>a.date.localeCompare(b.date));

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="day empty2"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const cats = [];
    if(bdaysByDay[d]) cats.push('b');
    if(actsByDay[d]) cats.push('a');
    if(examsByDay[d]) cats.push(examsByDay[d]);
    let style = '';
    if(cats.length===1){
      style = `background:${DAY_COLORS[cats[0]]};font-weight:700;color:#2b2b2b;`;
    } else if(cats.length>1){
      const pct = 100/cats.length;
      const stops = cats.map((c,i)=>`${DAY_COLORS[c]} ${i*pct}%, ${DAY_COLORS[c]} ${(i+1)*pct}%`).join(', ');
      style = `background:linear-gradient(180deg, ${stops});font-weight:700;color:#2b2b2b;`;
    }
    cells += `<div class="day" style="${style}">${d}</div>`;
  }

  const bdayList = Object.keys(bdaysByDay).map(Number).sort((a,b)=>a-b).flatMap(d=>bdaysByDay[d].map(s=>({d,s})));
  const actList = Object.keys(actsByDay).map(Number).sort((a,b)=>a-b).flatMap(d=>actsByDay[d]);

  const examRow = e => `<div class="list-item"><span>${fmtDate(e.date)} — ${e.name} <span style="color:var(--ink-soft)">(${e.turma})</span></span><span style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="tag" style="background:${e.tipo==='1ª prova'?DAY_COLORS.e1:DAY_COLORS.e2};color:#1c2b3a">${e.tipo}</span><span class="dot ${e.status}" style="margin-left:0"></span></span></div>`;

  document.getElementById('main').innerHTML = `
    <div class="month-nav">
      <button onclick="calNav(-1)">‹</button>
      <div class="mtitle">${MESES[m]} ${y}</div>
      <button onclick="calNav(1)">›</button>
    </div>
    <div class="card" id="calSwipeArea">
      <div class="calendar-grid">
        ${WD.map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells}
      </div>
    </div>

    <div class="section-title" style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:${DAY_COLORS.e2};border-radius:3px;display:inline-block"></span>Provas finais do mês</div>
    <div class="card">
      ${examFinalList.map(examRow).join('') || '<div class="empty">Nenhuma prova final este mês.</div>'}
    </div>

    <div class="section-title" style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:${DAY_COLORS.e1};border-radius:3px;display:inline-block"></span>Primeiras provas do mês</div>
    <div class="card">
      ${examFirstList.map(examRow).join('') || '<div class="empty">Nenhuma primeira prova este mês.</div>'}
    </div>

    <div class="section-title" style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:#F3E08A;border-radius:3px;display:inline-block"></span>Atividades do mês</div>
    <div class="card">
      ${actList.map(a=> a.studentName
        ? `<div class="list-item tap" onclick="openActivityAction('${a.ownerKind}','${a.id1}','${a.id2||''}','${a.id}')"><span>${fmtDate(a.date)} — ${a.title} <span style="color:var(--ink-soft)">(${a.studentName})</span></span><span class="dot ${activityStatus(a)}" style="margin-left:0"></span></div>`
        : `<div class="list-item"><span>${fmtDate(a.date)} — ${a.title}</span><span class="tap" style="color:var(--red);font-size:13px;font-weight:700" onclick="excluirAtividadeModal('${a.id}')">Excluir</span></div>`
      ).join('') || '<div class="empty">Nenhuma atividade este mês.</div>'}
      <button class="btn secondary" style="margin-top:10px" onclick="addActivityModal()">+ Inserir atividade</button>
    </div>

    <div class="section-title" style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:#F3B4C7;border-radius:3px;display:inline-block"></span>Aniversariantes do mês</div>
    <div class="card">
      ${bdayList.map(({d,s})=>`<div class="list-item"><span>${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')} — ${s.name}</span><span style="color:var(--ink-soft);font-size:12.5px">${s.turma}</span></div>`).join('') || '<div class="empty">Nenhum aniversariante este mês.</div>'}
    </div>
  `;
}
function calNav(delta){
  nav.calMonth += delta;
  if(nav.calMonth<0){ nav.calMonth=11; nav.calYear--; }
  if(nav.calMonth>11){ nav.calMonth=0; nav.calYear++; }
  render();
}
function attachCalendarSwipe(){
  const el = document.getElementById('calSwipeArea');
  if(!el) return;
  let startX=null, startY=null;
  el.addEventListener('touchstart', (e)=>{ startX=e.touches[0].clientX; startY=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', (e)=>{
    if(startX===null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.5){
      calNav(dx<0 ? 1 : -1);
    }
    startX=null; startY=null;
  }, {passive:true});
}
function addActivityModal(){
  openModal(`
    <h2>Nova atividade</h2>
    <div class="field"><label>Nome da atividade</label><input type="text" id="actNome" placeholder="Ex: Prova de listening"></div>
    <div class="field"><label>Data</label><input type="date" id="actData" value="${todayISO()}"></div>

/* =========================================================
   ABSENCE CONTROL
   ========================================================= */
function renderAbsenceScreen(){
  const flat = allStudentsFlat();
  const nameToTurma = {};
  flat.forEach(s=>{ if(!(s.name in nameToTurma)) nameToTurma[s.name] = s.turma; });

  const byName = {};
  DATA.absences.forEach(a=>{ byName[a.studentName] = byName[a.studentName]||[]; byName[a.studentName].push(a); });

  const groups = {}; // turma name -> [student names]
  Object.keys(byName).forEach(n=>{
    const turma = nameToTurma[n] || 'Outros';
    groups[turma] = groups[turma]||[];
    groups[turma].push(n);
  });

  const rowsFor = names => sortByName(names.map(n=>({name:n}))).map(({name:n})=>`
    <div class="abs-row tap" onclick="openStudentAbsences('${encodeURIComponent(n)}')">
      <span>${n}</span>
      <span class="cnt">${byName[n].length} falta${byName[n].length===1?'':'s'}</span>
    </div>
  `).join('');

  let sections = '';
  DATA.turmas.forEach(t=>{
    if(groups[t.name] && groups[t.name].length){
      sections += `<div class="section-title">${t.name}</div><div class="card">${rowsFor(groups[t.name])}</div>`;
    }
  });
  if(groups['Particular'] && groups['Particular'].length){
    sections += `<div class="section-title">Particulares</div><div class="card">${rowsFor(groups['Particular'])}</div>`;
  }
  if(groups['Outros'] && groups['Outros'].length){
    sections += `<div class="section-title">Outros</div><div class="card">${rowsFor(groups['Outros'])}</div>`;
  }
  if(!sections){
    sections = `<div class="empty"><div class="ic">📋</div>Nenhuma falta registrada.</div>`;
  }

  document.getElementById('main').innerHTML = `
    <button class="btn" onclick="addAbsenceModal()">+ Inserir falta</button>
    ${sections}
  `;
}
function openStudentAbsences(encName){
  const n = decodeURIComponent(encName);
  const list = DATA.absences.filter(a=>a.studentName===n).sort((a,b)=>b.date.localeCompare(a.date));
  openModal(`
    <h2>${n}</h2>
    ${list.map(a=>`<div class="list-item"><span>${fmtDate(a.date)}</span><span style="display:flex;align-items:center;gap:10px"><span style="color:var(--ink-soft)">${reasonLabel(a)}</span><span class="tap" style="color:var(--accent);font-size:13px;font-weight:700" onclick="editAbsenceModal('${a.id}')">Editar</span><span class="tap" style="color:var(--red);font-size:13px;font-weight:700" onclick="excluirFaltaModal('${a.id}','${encName}')">Excluir</span></span></div>`).join('')}
    <button class="btn secondary" style="margin-top:14px" onclick="closeModal();addAbsenceModal('${n.replace(/'/g,"\\'")}')">+ Nova falta para ${n}</button>
    <button class="btn ghost" style="color:var(--red);margin-top:8px" onclick="limparFaltasAluno('${encName}')">Limpar faltas deste aluno</button>
  `);
}
function editAbsenceModal(absId){
  const a = DATA.absences.find(x=>x.id===absId);
  if(!a) return;
  window._absDraft = { name:a.studentName, date:a.date, reason:a.reason, reasonOther:a.reasonOther||'', editingId:a.id };
  window._allStudentNames = allStudentsFlat().map(s=>s.name);
  renderAbsFormModal();
}
function limparFaltasAluno(encName){
  const n = decodeURIComponent(encName);
  confirmModal({icon:'🧹', text:`Limpar todas as faltas de ${n}?`, sub:'Use ao final do livro/período.', okLabel:'Limpar', danger:true, onOk:()=>{
    DATA.absences = DATA.absences.filter(a=>a.studentName!==n);
    save(); closeModal(); toast('Faltas do aluno limpas'); render();
  }});
}
function excluirFaltaModal(absId, encName){
  const a = DATA.absences.find(x=>x.id===absId);
  if(!a) return;
  confirmModal({icon:'⚠️', text:`Excluir a falta de ${fmtDate(a.date)}?`, okLabel:'Excluir', danger:true, onOk:()=>{
    DATA.absences = DATA.absences.filter(x=>x.id!==absId);
    save();
    const stillHasOthers = DATA.absences.some(x=>x.studentName===a.studentName);
    closeModal();
    toast('Falta excluída');
    if(stillHasOthers) openStudentAbsences(encName); else render();
  }});
}
function reasonLabel(a){
  const r = typeof a === 'string' ? a : a.reason;
  if(r==='outro'){ const txt = (typeof a === 'object' && a.reasonOther) ? a.reasonOther : ''; return txt ? txt : 'Outro'; }
  return {saude:'Saúde', compromisso:'Compromisso', pessoal:'Pessoal', viagem:'Viagem', naoinformado:'Não informado'}[r] || r;
}
function addAbsenceModal(prefillName){
  window._absDraft = { name: prefillName||'', date: todayISO(), reason:'naoinformado', reasonOther:'', editingId:null };
  window._allStudentNames = allStudentsFlat().map(s=>s.name);
  renderAbsFormModal();
}
function renderAbsFormModal(){
  const d = window._absDraft;
  openModal(`
    <h2>${d.editingId ? 'Editar falta' : 'Inserir falta'}</h2>
    <div class="field"><label>Nome do aluno</label>
      <input type="text" id="absNome" placeholder="Digite o nome" autocomplete="off" value="${d.name.replace(/"/g,'&quot;')}" oninput="filterAbsNames(this.value)">
    </div>
    <div id="absAutocomplete"></div>
    <div class="field">
      <label>Data</label>
      <div class="card tap" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:0" onclick="showAbsDatePicker()">
        <span>${fmtDate(d.date)}</span>
        <span style="color:var(--accent)">Alterar</span>
      </div>
    </div>
    <div class="field"><label>Motivo</label>
      <div class="dropbox"><select id="absMotivo" onchange="toggleAbsOtherReason(this.value)">
        <option value="saude" ${d.reason==='saude'?'selected':''}>Saúde</option>
        <option value="compromisso" ${d.reason==='compromisso'?'selected':''}>Compromisso</option>
        <option value="pessoal" ${d.reason==='pessoal'?'selected':''}>Pessoal</option>
        <option value="viagem" ${d.reason==='viagem'?'selected':''}>Viagem</option>
        <option value="naoinformado" ${d.reason==='naoinformado'?'selected':''}>Não informado</option>
        <option value="outro" ${d.reason==='outro'?'selected':''}>Outro (digitar)</option>
      </select></div>
    </div>
    <div class="field" id="absMotivoOutroWrap" style="display:${d.reason==='outro'?'block':'none'}">
      <label>Qual motivo?</label>
      <input type="text" id="absMotivoOutro" placeholder="Digite o motivo" value="${(d.reasonOther||'').replace(/"/g,'&quot;')}">
    </div>
    <div class="btn-row">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="confirmAddAbsence()">Salvar</button>
    </div>
  `);
}
function toggleAbsOtherReason(val){
  const wrap = document.getElementById('absMotivoOutroWrap');
  if(wrap){
    wrap.style.display = (val==='outro') ? 'block' : 'none';
    if(val==='outro'){
      const inp = document.getElementById('absMotivoOutro');
      if(inp) setTimeout(()=>inp.focus(), 50);
    }
  }
}
function syncAbsDraftFromForm(){
  const nomeEl = document.getElementById('absNome');
  const motivoEl = document.getElementById('absMotivo');
  const outroEl = document.getElementById('absMotivoOutro');
  if(nomeEl) window._absDraft.name = nomeEl.value;
  if(motivoEl) window._absDraft.reason = motivoEl.value;
  if(outroEl) window._absDraft.reasonOther = outroEl.value;
}
function filterAbsNames(val){
  const box = document.getElementById('absAutocomplete');
  if(!val){ box.innerHTML=''; return; }
  const matches = (window._allStudentNames||[]).filter(n=>n.toLowerCase().includes(val.toLowerCase())).slice(0,6);
  box.innerHTML = matches.length ? `<div class="autocomplete-list">${matches.map(n=>`<div onclick="pickAbsName('${n.replace(/'/g,"\\'")}')">${n}</div>`).join('')}</div>` : '';
}
function pickAbsName(n){
  window._absDraft.name = n;
  document.getElementById('absNome').value = n;
  document.getElementById('absAutocomplete').innerHTML='';
}
function showAbsDatePicker(){
  syncAbsDraftFromForm();
  renderAbsDatePickerView(new Date(window._absDraft.date+'T00:00:00'));
}
function renderAbsDatePickerView(centerDate){
  window._absPickerCenter = centerDate;
  const days = [];
  for(let i=-4;i<=15;i++){ const dd = new Date(centerDate); dd.setDate(dd.getDate()+i); days.push(dd); }
  const todayS = todayISO();
  const rows = days.map(dd=>{
    const iso = dd.toISOString().slice(0,10);
    const isToday = iso===todayS;
    const isSel = iso===window._absDraft.date;
    const label = iso===todayS ? 'Hoje' : `${WD_ABR[dd.getDay()]}, ${dd.getDate()} de ${MESES_ABR[dd.getMonth()].toLowerCase()}`;
    return `<div class="dp-row ${isToday&&!isSel?'today':''} ${isSel?'selected':''}" onclick="pickAbsDate('${iso}')">
      <span>${label}</span><span class="wd">${dd.getFullYear()}</span>
    </div>`;
  }).join('');
  openModal(`
    <div class="dp-header">
      <button onclick="shiftAbsPicker(-14)">‹</button>
      <div class="dp-title">Selecionar data</div>
      <button onclick="shiftAbsPicker(14)">›</button>
    </div>
    <div class="dp-list">${rows}</div>
    <div class="dp-jump"><a onclick="switchAbsToNativeDate()">Digitar uma data específica</a></div>
    <button class="btn ghost" style="margin-top:10px" onclick="renderAbsFormModal()">‹ Voltar</button>
  `);
}
function shiftAbsPicker(delta){
  const d = new Date(window._absPickerCenter);
  d.setDate(d.getDate()+delta);
  renderAbsDatePickerView(d);
}
function pickAbsDate(iso){
  window._absDraft.date = iso;
  renderAbsFormModal();
}
function switchAbsToNativeDate(){
  openModal(`
    <h2>Digitar data</h2>
    <div class="field"><input type="date" id="absNativeInput" value="${window._absDraft.date}"></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="renderAbsFormModal()">Cancelar</button>
      <button class="btn" onclick="confirmAbsNativeDate()">OK</button>
    </div>
  `);
}
function confirmAbsNativeDate(){
  const val = document.getElementById('absNativeInput').value;
  if(val) window._absDraft.date = val;
  renderAbsFormModal();
}
function confirmAddAbsence(){
  syncAbsDraftFromForm();
  const nome = window._absDraft.name.trim();
  const data = window._absDraft.date;
  const motivo = window._absDraft.reason;
  const motivoOutro = window._absDraft.reasonOther||'';
  const editingId = window._absDraft.editingId;
  if(!nome){ toast('Digite o nome do aluno'); return; }
  if(motivo==='outro' && !motivoOutro.trim()){ toast('Digite o motivo'); return; }
  if(editingId){
    const a = DATA.absences.find(x=>x.id===editingId);
    if(a){ a.studentName=nome; a.date=data; a.reason=motivo; a.reasonOther=motivoOutro.trim(); }
    save(); closeModal(); toast('Falta atualizada'); render();
  } else {
    DATA.absences.push({id:uid(), studentName:nome, date:data, reason:motivo, reasonOther:motivoOutro.trim()});
    save(); closeModal(); toast('Falta registrada'); render();
  }
}
function limparFaltasModal(){
  confirmModal({icon:'🧹', text:'Limpar todas as faltas registradas?', sub:'Use ao final do livro/período.', okLabel:'Limpar tudo', danger:true, onOk:()=>{
    DATA.absences = []; save(); closeModal(); toast('Faltas limpas'); render();
  }});
}

/* =========================================================
   SETTINGS
   ========================================================= */
function renderSettingsScreen(){
  document.getElementById('main').innerHTML = `
    <div class="section-title">Tema de cores</div>
    <div class="settheme-opt ${DATA.settings.theme==='fria'?'sel':''}" onclick="setTheme('fria')">
      <div class="swatches"><span style="background:#6B93B0"></span><span style="background:#B0C9CC"></span></div>
      <div><b>Fria</b><div style="font-size:12.5px;color:var(--ink-soft)">Azul e verde-água</div></div>
    </div>
    <div class="settheme-opt ${DATA.settings.theme==='quente'?'sel':''}" onclick="setTheme('quente')">
      <div class="swatches"><span style="background:#C48F94"></span><span style="background:#EDCCC0"></span></div>
      <div><b>Quente</b><div style="font-size:12.5px;color:var(--ink-soft)">Rosa e pêssego</div></div>
    </div>

    <div class="section-title">Instruções de uso</div>
    <div class="card">
      <div class="instr-block">
        <h4>📚 Turmas</h4>
        <p>No topo da tela, o campo de busca acha qualquer aluno pelo nome — inclusive os que já foram encerrados e estão no histórico.</p>
        <p>Toque numa turma para ver os alunos.</p>
        <p>Toque num aluno para editar dados e as datas de prova.</p>
        <p>Quando o aluno terminar o livro, use "Finalizar livro". O livro concluído vai para o histórico, e o aluno continua na turma.</p>
        <p>Quando o aluno sair da turma, use "Encerrar aluno". Ele vai para o histórico — nada é apagado.</p>
        <p>Dentro do aluno, em "Atividades do aluno", dá para cadastrar tarefas com data (além das provas). Se passar do prazo sem marcar como concluída, fica laranja.</p>
        <p>O botão "📋 Exportar lista em texto" gera a lista de chamada pronta pra copiar e colar (ex: num grupo do WhatsApp).</p>
      </div>
      <div class="instr-block">
        <h4>👤 Particulares</h4>
        <p>Alunos particulares não têm lista de chamada.</p>
        <p>Você escolhe a ordem: alfabética ou manual (arrastando).</p>
        <p>Ao encerrar um aluno, ele vai para o histórico de particulares, com a data de início, fim e quanto tempo foi seu aluno.</p>
        <p>Assim como nas turmas, dá para cadastrar "Atividades do aluno" com data e marcar como concluída.</p>
      </div>
      <div class="instr-block">
        <h4>📅 Calendário</h4>
        <p>Cada dia colorido no calendário indica algo especial:</p>
        ${calendarLegendRows()}
        <p>Se um dia tiver mais de um evento, ele aparece dividido nas duas (ou três) cores.</p>
        <p>Para trocar de mês, arraste o dedo para o lado ou toque nas setinhas.</p>
        <p>Logo abaixo do calendário, três listas detalham o mês inteiro: as provas marcadas, os aniversariantes e as atividades — tudo em ordem de data.</p>
      </div>
      <div class="instr-block">
        <h4>📋 Absence Control</h4>
        <p>Toque em "+ Inserir falta" para registrar uma falta.</p>
        <p>Toque num aluno da lista para ver o histórico dele.</p>
        <p>Ali dá pra limpar as faltas desse aluno — use ao final do livro.</p>
      </div>
      <div class="instr-block" style="margin-bottom:0">
        <h4>🔵 Cores de referência</h4>
        ${dotLegendRows()}
      </div>
      <button class="btn secondary" style="margin-top:4px" onclick="startTutorial()">▶ Ver tutorial</button>
    </div>

    <div class="section-title">Backup</div>
    <div class="card">
      <p style="font-size:13.5px;color:var(--ink-soft);margin-top:0">Exporte seus dados para guardar uma cópia de segurança, ou importe um backup salvo anteriormente.</p>
      ${DATA.settings.lastBackupAt ? `<div class="badge-ref" style="margin-bottom:14px">Último backup: <b>${fmtDateTime(DATA.settings.lastBackupAt)}</b></div>` : `<p style="font-size:12.5px;color:var(--red);margin:-6px 0 14px 0">Você ainda não exportou nenhum backup.</p>`}
      <div class="btn-row">
        <button class="btn secondary" onclick="exportBackup()">Exportar</button>
        <button class="btn secondary" onclick="document.getElementById('importFile').click()">Importar</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(this)">
    </div>
  `;
}
function setTheme(theme){
  DATA.settings.theme = theme;
  document.documentElement.setAttribute('data-theme', theme==='quente'?'warm':'cool');
  save(); render();
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sgta_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  DATA.settings.lastBackupAt = new Date().toISOString();
  save();
  toast('Backup exportado');
  render();
}
function importBackup(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      DATA = parsed; save();
      document.documentElement.setAttribute('data-theme', DATA.settings.theme==='quente'?'warm':'cool');
      toast('Backup importado'); render();
    }catch(err){ toast('Arquivo inválido'); }
  };
  reader.readAsText(file);
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  renderTopbar();
  renderBottomNav();
  if(nav.tab==='turmas') renderTurmasScreen();
  else if(nav.tab==='particulares') renderParticularesScreen();
  else if(nav.tab==='calendario'){ renderCalendarioScreen(); attachCalendarSwipe(); }
  else if(nav.tab==='absence') renderAbsenceScreen();
  else if(nav.tab==='settings') renderSettingsScreen();
  document.getElementById('main').scrollTop = 0;
}

document.getElementById('bottomnav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(btn) setTab(btn.dataset.tab);
});

document.documentElement.setAttribute('data-theme', DATA.settings.theme==='quente'?'warm':'cool');
document.getElementById('navParticularIcon').innerHTML = personIconSVG(25);
render();
if(!DATA.settings.tutorialSeen){
  setTimeout(()=>startTutorial(), 350);
}

/* PWA-ish: register minimal service worker inline is skipped since single-file offline already works via file:// or GitHub Pages caching by browser. */
</script>
</body>
</html>
